<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}body{display:flex;align-items:center;justify-content:center}
#t{min-width:40vw;max-width:80vw;margin-top:-14vh;outline:none;white-space:pre-wrap;text-align:center;color:#fff;font:600 54px/1.3 -apple-system,sans-serif}</style></head>
<body><div id="t" contenteditable="true"></div><script>
let key='RecessNote';const t=document.getElementById('t');
function recessInfo(j){const o=JSON.parse(j);key='RecessNote-'+o.breakIdentifier;t.textContent=localStorage[key]||'Edit this to say whatever you like!\nJust click and type.'}
t.addEventListener('input',()=>{localStorage[key]=t.textContent});
try{window.webkit.messageHandlers.getRecessInfo.postMessage('summary')}catch(e){recessInfo('{"breakIdentifier":"x"}')}
</script></body></html>
