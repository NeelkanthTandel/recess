<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;overflow:hidden;background:#05101f}
.b{position:absolute;width:70vw;height:70vw;border-radius:50%;filter:blur(90px);opacity:.55;mix-blend-mode:screen;animation:m 26s ease-in-out infinite alternate}
#a{background:#1dd1a1;left:-10vw;top:-20vw}#b{background:#5f27cd;right:-15vw;top:0;animation-duration:32s}#c{background:#48dbfb;left:20vw;bottom:-35vw;animation-duration:38s}
@keyframes m{0%{transform:translate(0,0) scale(1)}50%{transform:translate(12vw,8vh) scale(1.2)}100%{transform:translate(-8vw,-6vh) scale(.9)}}</style></head>
<body><div class="b" id="a"></div><div class="b" id="b"></div><div class="b" id="c"></div></body></html>
