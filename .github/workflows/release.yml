# Builds a universal Recess.app, packs it into Recess.dmg and publishes a GitHub Release.
#
# Triggered by pushing a version tag (v1.2.3). Tags matching v* are protected by a repository
# ruleset, so only maintainers can start a release.
#
# Signing is optional. Without secrets the app is signed ad hoc and users see a one-time
# Gatekeeper prompt. Add the secrets listed in docs/RELEASING.md and the same workflow signs
# with your Developer ID, notarizes and staples the DMG.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write # create the GitHub Release and upload the DMG
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Read version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::Tag $GITHUB_REF_NAME isn't a version like v1.2.3"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then echo "::error::No Developer ID Application identity in the certificate"; exit 1; fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build_app.sh --universal

      - name: Build disk image
        run: scripts/make_dmg.sh

      - name: Notarize and staple
        if: env.SIGN_IDENTITY != '' && env.APPLE_ID != ''
        run: |
          xcrun notarytool submit build/Recess.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple build/Recess.dmg
          spctl --assess --type open --context context:primary-signature -v build/Recess.dmg

      - name: Checksum
        run: cd build && shasum -a 256 Recess.dmg > Recess.dmg.sha256 && cat Recess.dmg.sha256

      - name: Write release notes
        run: |
          {
            echo "Download **Recess.dmg** below, open it and drag Recess to Applications. Requires macOS 14 or later (Apple Silicon or Intel)."
            echo
            if [ -z "$SIGN_IDENTITY" ]; then
              echo "### First launch"
              echo
              echo "This build isn't notarized by Apple yet, so macOS blocks it the first time:"
              echo
              echo "1. Open Recess. When macOS says it can't verify the app, click **Done**."
              echo "2. Open **System Settings › Privacy & Security**, scroll to **Security** and click **Open Anyway** next to Recess."
              echo "3. Confirm with your password or Touch ID, then click **Open**."
              echo
              echo "You only need to do this once. Prefer the Terminal? \`xattr -dr com.apple.quarantine /Applications/Recess.app\`"
              echo
            fi
            echo "SHA-256: \`$(cut -d' ' -f1 build/Recess.dmg.sha256)\`"
          } > "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Recess.dmg build/Recess.dmg.sha256 \
            --verify-tag --title "Recess $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes

      - name: Remove signing keychain
        if: always() && env.MACOS_CERTIFICATE_P12 != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
