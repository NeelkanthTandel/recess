name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Toolchain
        run: swift --version
      - name: Lint
        run: make lint
      - name: Test
        run: swift test
      - name: Build app bundle
        run: scripts/build_app.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Recess.app
          path: build/Recess.app
          retention-days: 7
